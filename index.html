<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lieferscheine – aboutwater</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://basemaps.cartocdn.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=ASAP:wght@300;400;500;600;700&display=swap');

    :root {
      --primary:        #1c5975;
      --primary-dark:   #154c66;
      --primary-light:  #2d7a9a;
      --text:           #1e2d3d;
      --text-muted:     #64748b;
      --bg:             #f0f4f8;
      --white:          #ffffff;
      --shadow-sm:      0 1px 6px rgba(0,0,0,0.06), 0 2px 12px rgba(28,89,117,0.08);
      --shadow-md:      0 4px 24px rgba(28,89,117,0.14);
      --radius:         12px;
      --ease:           all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'ASAP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-light) 100%);
      padding: 0 28px;
      height: 68px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 2px 16px rgba(21,76,102,0.35);
      position: relative;
      overflow: hidden;
    }
    .header::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, transparent 70%);
      pointer-events: none;
    }
    .header-logo-wrap {
      background: var(--white);
      border-radius: 8px;
      padding: 6px 14px;
      display: flex; align-items: center;
      flex-shrink: 0;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
    }
    .header-logo {
      height: 34px; width: auto;
      object-fit: contain; display: block;
    }
    .header-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.25); flex-shrink: 0; }
    .header-text { flex: 1; min-width: 0; }
    .header-text h1 {
      font-size: 1.25em; font-weight: 700;
      color: var(--white); letter-spacing: -0.2px; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header-text p { font-size: 0.8em; color: rgba(255,255,255,0.7); font-weight: 400; margin-top: 2px; }

    /* ── Date nav (lives inside the header) ── */
    .date-nav {
      display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      padding: 5px 8px;
      flex-shrink: 0;
    }
    .nav-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      width: 28px; height: 28px;
      cursor: pointer;
      font-size: 11px; color: var(--white);
      display: flex; align-items: center; justify-content: center;
      transition: var(--ease); flex-shrink: 0;
    }
    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.3); }
    .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    #datum-picker {
      border: none; background: transparent;
      font-family: 'ASAP', sans-serif;
      font-size: 12px; font-weight: 600;
      color: var(--white);
      cursor: pointer; outline: none;
      padding: 2px 4px; min-width: 110px;
    }
    #datum-picker::-webkit-calendar-picker-indicator {
      filter: invert(1); opacity: 0.7; cursor: pointer;
    }

    /* ── Download button (lives inside the header) ── */
    .download-btn {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 8px;
      padding: 6px 13px;
      font-family: 'ASAP', sans-serif;
      font-size: 12px; font-weight: 600;
      color: var(--white);
      cursor: pointer;
      transition: var(--ease);
      white-space: nowrap; flex-shrink: 0;
      backdrop-filter: blur(4px);
    }
    .download-btn:hover { background: rgba(255,255,255,0.28); }
    .download-btn:active { transform: translateY(1px); }
    .download-btn svg { flex-shrink: 0; }

    /* ── Stats bar ── */
    .stats-bar {
      margin: 14px 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.05);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 14px;
      transition: var(--ease);
      position: relative; overflow: hidden;
    }
    .stat::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--primary); border-radius: 4px 0 0 4px;
    }
    .stat:nth-child(2)::before { background: #667eea; }
    .stat:nth-child(3)::before { background: #764ba2; }
    .stat:nth-child(4)::before { background: #28a745; }
    .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .stat-icon { font-size: 1.6em; line-height: 1; flex-shrink: 0; opacity: 0.7; }
    .stat-info { flex: 1; }
    .stat-number { font-size: 1.9em; font-weight: 700; color: var(--text); line-height: 1; }
    .stat-label {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px;
    }

    /* ── Map ── */
    .map-wrapper {
      margin: 0 16px 16px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(0,0,0,0.07);
      position: relative;
    }
    #map { width: 100%; height: calc(100vh - 196px); min-height: 520px; }

    /* ── Loading overlay ── */
    .loading-overlay {
      position: absolute; inset: 0;
      background: rgba(240,244,248,0.92);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 2000;
      backdrop-filter: blur(4px);
    }
    .loading-overlay.hidden { display: none; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(28,89,117,0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-overlay p { font-size: 14px; font-weight: 500; color: var(--primary); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Legend ── */
    .legend {
      position: absolute; bottom: 20px; left: 16px;
      background: rgba(255,255,255,0.97);
      padding: 14px 16px; border-radius: var(--radius);
      box-shadow: var(--shadow-md); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.06);
      z-index: 1000; min-width: 160px;
      max-height: calc(100% - 40px); overflow-y: auto;
    }
    .legend h4 {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 10px; padding-bottom: 8px;
      border-bottom: 1px solid #e9eef3;
    }
    .legend-item { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    .legend-item span { font-size: 12px; font-weight: 500; color: var(--text); }
    .legend-count {
      margin-left: auto; font-size: 10px; font-weight: 700; color: var(--text-muted);
      background: #f0f4f8; border-radius: 8px; padding: 1px 6px;
      min-width: 20px; text-align: center;
    }

    /* ── Filter panel ── */
    .filter-panel {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.97);
      padding: 14px; border-radius: var(--radius);
      box-shadow: var(--shadow-md); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.06);
      z-index: 1000; min-width: 170px; max-width: 190px;
      max-height: calc(100% - 32px); overflow-y: auto;
    }
    .filter-panel h4 {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 8px; padding-bottom: 8px;
      border-bottom: 1px solid #e9eef3;
    }
    .filter-btn {
      display: flex; align-items: center;
      width: 100%; text-align: left;
      padding: 6px 10px; margin-bottom: 3px;
      border: 1px solid transparent; border-radius: 7px;
      cursor: pointer;
      font-family: 'ASAP', sans-serif; font-size: 12px; font-weight: 500;
      transition: var(--ease); background: transparent; color: var(--text);
    }
    .filter-btn:hover { background: #f0f4f8; }
    .filter-btn.active {
      background: var(--primary); color: var(--white);
      border-color: var(--primary-dark); border-left-color: transparent;
    }
    .filter-count {
      margin-left: auto; font-size: 10px; font-weight: 700;
      background: rgba(0,0,0,0.07); border-radius: 8px;
      padding: 1px 6px; min-width: 20px; text-align: center; flex-shrink: 0;
    }
    .filter-btn.active .filter-count { background: rgba(255,255,255,0.25); color: var(--white); }

    /* ── Popup ── */
    .popup-content { font-family: 'ASAP', sans-serif; min-width: 210px; }
    .popup-header {
      font-size: 14px; font-weight: 600; color: var(--text);
      border-bottom: 2px solid var(--primary);
      padding-bottom: 7px; margin-bottom: 9px;
    }
    .popup-row {
      display: flex; justify-content: space-between;
      padding: 4px 0; border-bottom: 1px solid #f1f3f4; gap: 8px;
    }
    .popup-row:last-child { border-bottom: none; }
    .popup-label {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.4px;
      white-space: nowrap; padding-top: 1px;
    }
    .popup-value { font-size: 12px; font-weight: 500; color: var(--text); text-align: right; }
    .popup-badge {
      display: inline-block; padding: 1px 7px; border-radius: 10px;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .badge-ja   { background: #d4edda; color: #155724; }
    .badge-nein { background: #fff3cd; color: #856404; }
    .popup-comment-row { padding: 4px 0 6px; border-bottom: 1px solid #f1f3f4; }
    .popup-comment-row:last-child { border-bottom: none; }
    .popup-comment-input {
      width: 100%; padding: 5px 9px;
      font-family: 'ASAP', sans-serif; font-size: 11px; color: var(--text);
      background: #fffdf0; border: 1px solid #e8d87a; border-radius: 6px;
      outline: none; transition: var(--ease);
    }
    .popup-comment-input:focus {
      border-color: #c8a800; background: #fffef5;
      box-shadow: 0 0 0 2px rgba(200,168,0,0.15);
    }
    .popup-comment-input::placeholder { color: #b0a060; }
    .popup-count {
      background: var(--primary); color: var(--white);
      padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600;
    }

    /* ── Animations ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .header    { animation: fadeInUp 0.35s cubic-bezier(0.4,0,0.2,1) both; }
    .stats-bar { animation: fadeInUp 0.4s  cubic-bezier(0.4,0,0.2,1) 0.10s both; }
    .map-wrapper { animation: fadeInUp 0.45s cubic-bezier(0.4,0,0.2,1) 0.16s both; }
    .stat { animation: fadeInUp 0.4s cubic-bezier(0.4,0,0.2,1) both; }
    .stat:nth-child(1) { animation-delay: 0.14s; }
    .stat:nth-child(2) { animation-delay: 0.20s; }
    .stat:nth-child(3) { animation-delay: 0.26s; }
    .stat:nth-child(4) { animation-delay: 0.32s; }

    /* ── Leaflet overrides ── */
    .leaflet-popup-content-wrapper {
      border-radius: var(--radius) !important;
      box-shadow: var(--shadow-md) !important;
      padding: 14px !important;
    }
    .leaflet-popup-content { margin: 0 !important; }
    .leaflet-control-zoom { border: none !important; box-shadow: var(--shadow-sm) !important; }
    .leaflet-control-zoom a {
      background: var(--white) !important; color: var(--text) !important;
      border-color: rgba(0,0,0,0.08) !important; font-family: 'ASAP', sans-serif !important;
    }
    .leaflet-control-zoom a:hover { background: var(--primary) !important; color: var(--white) !important; }
    .leaflet-control-attribution { font-family: 'ASAP', sans-serif !important; font-size: 10px !important; }

    @media (max-width: 640px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .header { flex-wrap: wrap; height: auto; padding: 10px 16px; gap: 10px; }
      .download-btn span { display: none; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo-wrap">
    <img src="Logo.png" alt="aboutwater" class="header-logo">
  </div>
  <div class="header-divider"></div>
  <div class="header-text">
    <h1 id="header-title">Lieferscheine</h1>
    <p>Lieferstandorte auf der Karte</p>
  </div>
  <div class="date-nav">
    <button class="nav-btn" id="btn-prev" title="Vorheriger Tag" onclick="navigateDatum(-1)" disabled>&#9664;</button>
    <input type="date" id="datum-picker" onchange="datumWaehlen(this.value)">
    <button class="nav-btn" id="btn-next" title="Nächster Tag" onclick="navigateDatum(1)" disabled>&#9654;</button>
  </div>
  <div class="header-divider"></div>
  <button class="download-btn" onclick="csvHerunterladen()" title="CSV für dieses Datum herunterladen">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span>CSV herunterladen</span>
  </button>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-icon">📦</div>
    <div class="stat-info">
      <div class="stat-number" id="stat-total">–</div>
      <div class="stat-label">Lieferscheine</div>
    </div>
  </div>
  <div class="stat">
    <div class="stat-icon">📍</div>
    <div class="stat-info">
      <div class="stat-number" id="stat-locations">–</div>
      <div class="stat-label">Standorte</div>
    </div>
  </div>
  <div class="stat">
    <div class="stat-icon">🏭</div>
    <div class="stat-info">
      <div class="stat-number" id="stat-lager">–</div>
      <div class="stat-label">Lager</div>
    </div>
  </div>
  <div class="stat">
    <div class="stat-icon">✅</div>
    <div class="stat-info">
      <div class="stat-number" id="stat-geprueft">–</div>
      <div class="stat-label">Geprüft</div>
    </div>
  </div>
</div>

<div class="map-wrapper">
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <p>Daten werden geladen …</p>
  </div>
  <div id="map"></div>
  <div class="legend">
    <h4>Lager</h4>
    <div id="legend-items"></div>
  </div>
  <div class="filter-panel">
    <h4>Lager filtern</h4>
    <button class="filter-btn active" data-all="true" onclick="lagerFiltern('all', this)">
      Alle <span class="filter-count" id="filter-all-count">0</span>
    </button>
    <div id="filter-buttons"></div>
  </div>
</div>

const LAGER_FARBEN = {

const MONATE_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

// ═══════════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════════
let ALLE_LIEFERSCHEINE = [];   // All records from CSV
let VERFUEGBARE_DATEN  = [];   // Sorted array of "DD.MM.YYYY" strings that have data
let AKTUELLES_DATUM    = null; // Currently displayed date
let alleMarker         = [];
let KUNDEN_COORDS      = {};   // customerNumber (string) → {lat, lng} from customers_for_map.json

// ═══════════════════════════════════════════════════════════════════════════════
// MAP SETUP
// ═══════════════════════════════════════════════════════════════════════════════
const karte = L.map('map', { center: [51.2, 10.4], zoom: 6, preferCanvas: true });

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, © <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19,
}).addTo(karte);

const ebene = L.layerGroup().addTo(karte);

// ── Icon cache (reuse SVG icons per colour) ──
const _iconCache = {};
function markerIcon(farbe) {
  if (_iconCache[farbe]) return _iconCache[farbe];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z"
          fill="${farbe}" stroke="white" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="4" fill="white" opacity="0.9"/>
  </svg>`;
  _iconCache[farbe] = L.divIcon({ html: svg, className: '', iconSize: [24,36], iconAnchor: [12,36], popupAnchor: [0,-38] });
  return _iconCache[farbe];
}

function lagerFarbe(lager) { return LAGER_FARBEN[lager] || "#95a5a6"; }

// ═══════════════════════════════════════════════════════════════════════════════
// HELPERS – DATE FORMATTING
// ═══════════════════════════════════════════════════════════════════════════════
// "13.03.2026" → "2026-03-13"
function csvDatumZuInput(d) {
  const [day, month, year] = d.split('.');
  return `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`;
}
// "2026-03-13" → "13.03.2026"
function inputDatumZuCSV(d) {
  const [year, month, day] = d.split('-');
  return `${day}.${month}.${year}`;
}
// "13.03.2026" → "13.03.2026"
function formatDatumDE(d) {
  const [day, month, year] = d.split('.');
  return `${day.padStart(2,'0')}.${month.padStart(2,'0')}.${year}`;
}

// ═══════════════════════════════════════════════════════════════════════════════
// HELPERS – PLZ NORMALISATION
// German PLZs sometimes appear without leading zero in the CSV (e.g. "8297" → "08297")
// Hungarian PLZs are 4-digit and start ≥ 1000.
// ═══════════════════════════════════════════════════════════════════════════════
function normalizePLZ(raw) {
  const s = raw.trim();
  if (/^\d{4}$/.test(s)) {
    const padded = '0' + s;
    if (PLZ_COORDS[padded + '|DE']) return { plz: padded, land: 'DE' };
    if (PLZ_COORDS[s + '|HU'])     return { plz: s,      land: 'HU' };
    return { plz: padded, land: 'DE' }; // best-effort fallback
  }
  return { plz: s, land: 'DE' };
}

// ═══════════════════════════════════════════════════════════════════════════════
// CSV PARSING
// Expected header: Lagerkürzel;Auftragsnummer;LS-Nr.;geprüft j/n;Lieferdatum;
//                  Bearbeiter;Kundennummer;Kundenkürzel;L.-Name 1;L.-Straße;L.-PLZ;L.-Ort;
// ═══════════════════════════════════════════════════════════════════════════════
function csvParsieren(text) {
  const lines = text.trim().split(/\r?\n/);
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const f = line.split(';');
    if (f.length < 12) continue;
    const { plz, land } = normalizePLZ(f[10] || '');
    result.push({
      lager:      (f[0]  || '').trim(),
      auftrags:   (f[1]  || '').trim(),
      ls:         (f[2]  || '').trim(),
      geprueft:   (f[3]  || '').trim().toLowerCase() === 'ja' ? 'ja' : 'nein',
      datum:      (f[4]  || '').trim(),
      bearbeiter: (f[5]  || '').trim(),
      kundennr:   (f[6]  || '').trim(),
      kunde:      ((f[8] || f[7] || '')).trim(), // prefer L.-Name 1 (full name)
      strasse:    (f[9]  || '').trim(),
      plz, ort: (f[11] || '').trim(), land,
    });
  }
  return result;
}

// ═══════════════════════════════════════════════════════════════════════════════
// CSV LOADING (async, called once on page load)
// ═══════════════════════════════════════════════════════════════════════════════
async function csvLaden() {
  const overlay = document.getElementById('loading-overlay');
  try {
    // Fetch CSV + slim coords in parallel (coords.json is 29 KB, not 3.3 MB)
    const [csvResp, coordsResp] = await Promise.all([
      fetch('./lieferschine.csv'),
      fetch('./coords.json'),
    ]);
    if (!csvResp.ok)    throw new Error(`CSV: HTTP ${csvResp.status}`);
    if (!coordsResp.ok) throw new Error(`Koordinaten: HTTP ${coordsResp.status}`);

    const [text, coordsData] = await Promise.all([csvResp.text(), coordsResp.json()]);

    // coords.json format: { "kundennr": [lat, lng], … }
    Object.entries(coordsData).forEach(([k, v]) => {
      KUNDEN_COORDS[k] = { lat: v[0], lng: v[1] };
    });

    ALLE_LIEFERSCHEINE = csvParsieren(text);

    // Collect unique dates and sort ascending
    const datumsSet = new Set(ALLE_LIEFERSCHEINE.map(d => d.datum).filter(Boolean));
    VERFUEGBARE_DATEN = [...datumsSet].sort((a, b) => {
      const toMs = s => { const [d,m,y] = s.split('.'); return new Date(`${y}-${m}-${d}`).getTime(); };
      return toMs(a) - toMs(b);
    });

    if (VERFUEGBARE_DATEN.length === 0) throw new Error('Keine Daten in der CSV gefunden.');

    // Set date picker bounds
    const picker = document.getElementById('datum-picker');
    picker.min = csvDatumZuInput(VERFUEGBARE_DATEN[0]);
    picker.max = csvDatumZuInput(VERFUEGBARE_DATEN[VERFUEGBARE_DATEN.length - 1]);

    // Show most recent date by default
    overlay.classList.add('hidden');
    datumAnzeigen(VERFUEGBARE_DATEN[VERFUEGBARE_DATEN.length - 1]);

  } catch (err) {
    overlay.innerHTML = `<p style="color:#dc3545;font-weight:600">Fehler beim Laden:<br>${err.message}</p>`;
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// DATE NAVIGATION
// ═══════════════════════════════════════════════════════════════════════════════
function navigateDatum(richtung) {
  const idx = VERFUEGBARE_DATEN.indexOf(AKTUELLES_DATUM);
  const next = idx + richtung;
  if (next >= 0 && next < VERFUEGBARE_DATEN.length) datumAnzeigen(VERFUEGBARE_DATEN[next]);
}

function datumWaehlen(inputValue) {
  // inputValue format: "2026-03-13"
  const csvDatum = inputDatumZuCSV(inputValue);
  if (VERFUEGBARE_DATEN.includes(csvDatum)) {
    datumAnzeigen(csvDatum);
  } else {
    // Snap back to current valid date
    document.getElementById('datum-picker').value = csvDatumZuInput(AKTUELLES_DATUM);
  }
}

function datumAnzeigen(datum) {
  AKTUELLES_DATUM = datum;

  // Sync date picker
  document.getElementById('datum-picker').value = csvDatumZuInput(datum);

  // Update header title
  document.getElementById('header-title').textContent = 'Lieferscheine – ' + formatDatumDE(datum);
  document.title = `Lieferscheine ${datum} – aboutwater`;

  // Update prev/next button state
  const idx = VERFUEGBARE_DATEN.indexOf(datum);
  document.getElementById('btn-prev').disabled = idx <= 0;
  document.getElementById('btn-next').disabled = idx >= VERFUEGBARE_DATEN.length - 1;

  // Rebuild map for this date
  const tagesDaten = ALLE_LIEFERSCHEINE.filter(d => d.datum === datum);
  karteAktualisieren(tagesDaten);
}

// ═══════════════════════════════════════════════════════════════════════════════
// MAP REBUILD
// ═══════════════════════════════════════════════════════════════════════════════
function karteAktualisieren(lieferscheine) {
  // Clear previous state
  ebene.clearLayers();
  alleMarker = [];
  document.getElementById('legend-items').innerHTML = '';
  document.getElementById('filter-buttons').innerHTML = '';

  // Reset filter to "Alle"
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-all="true"]').classList.add('active');

  // Group deliveries by address (same PLZ + customer = one marker)
  const gruppen = {};
  lieferscheine.forEach(d => {
    const key = `${d.plz}|${d.ort}|${d.kunde}`;
    (gruppen[key] = gruppen[key] || []).push(d);
  });

  const lagerSet    = new Set();
  const lagerCounts = {};
  let standortAnzahl = 0;

  Object.values(gruppen).forEach(gruppe => {
    const erster = gruppe[0];
    // Try per-customer coords first (accurate), fall back to PLZ centre
    const koord = KUNDEN_COORDS[erster.kundennr] || PLZ_COORDS[`${erster.plz}|${erster.land}`];
    if (!koord) { console.warn('Keine Koordinaten:', erster.kundennr, erster.plz, erster.ort); return; }

    lagerSet.add(erster.lager);
    lagerCounts[erster.lager] = (lagerCounts[erster.lager] || 0) + gruppe.length;
    standortAnzahl++;

    // Slight random offset so overlapping markers (same PLZ) stay visible (~400 m)
    const lat = koord.lat + (Math.random() - 0.5) * 0.004;
    const lng = koord.lng + (Math.random() - 0.5) * 0.004;

    const marker = L.marker([lat, lng], { icon: markerIcon(lagerFarbe(erster.lager)) })
      .bindPopup(popupHTML(gruppe), { maxWidth: 320 });

    alleMarker.push({ marker, lager: erster.lager });
    ebene.addLayer(marker);
  });

  // Animate stats
  const geprueft = lieferscheine.filter(d => d.geprueft === 'ja').length;
  countUp(document.getElementById('stat-total'),     lieferscheine.length, 600);
  countUp(document.getElementById('stat-locations'), standortAnzahl,       600);
  countUp(document.getElementById('stat-lager'),     lagerSet.size,        600);
  countUp(document.getElementById('stat-geprueft'),  geprueft,             600);

  // Update "Alle" button count
  document.getElementById('filter-all-count').textContent = lieferscheine.length;

  // Rebuild legend + filter panel
  uiAufbauen([...lagerSet].sort(), lagerCounts);
}

// ═══════════════════════════════════════════════════════════════════════════════
// UI BUILDERS
// ═══════════════════════════════════════════════════════════════════════════════
function popupHTML(gruppe) {
  const erster = gruppe[0];
  const farbe  = lagerFarbe(erster.lager);
  const geprueftAnzahl = gruppe.filter(d => d.geprueft === 'ja').length;

  const lsZeilen = gruppe.map(d => `
    <div class="popup-row">
      <span class="popup-label">LS-Nr.</span>
      <span class="popup-value" style="display:flex;align-items:center;gap:6px">
        ${d.ls}
        ${d.geprueft === 'nein' ? `<span class="popup-badge badge-nein">offen</span>` : ''}
      </span>
    </div>
    ${d.geprueft === 'nein' ? `<div class="popup-comment-row">
      <input class="popup-comment-input" type="text" placeholder="Kommentar …">
    </div>` : ''}`).join('');

  return `<div class="popup-content">
    <div class="popup-header" style="border-color:${farbe}">${erster.kunde}</div>
    <div class="popup-row">
      <span class="popup-label">Adresse</span>
      <span class="popup-value">${erster.strasse}, ${erster.plz} ${erster.ort}</span>
    </div>
    <div class="popup-row">
      <span class="popup-label">Lager</span>
      <span class="popup-value" style="color:${farbe};font-weight:700">${erster.lager}</span>
    </div>
    <div class="popup-row">
      <span class="popup-label">Lieferscheine</span>
      <span class="popup-value"><span class="popup-count">${gruppe.length}</span></span>
    </div>
    ${lsZeilen}
    <div class="popup-row">
      <span class="popup-label">Geprüft</span>
      <span class="popup-value">${geprueftAnzahl}/${gruppe.length}
        <span class="popup-badge badge-ja">ja</span>
        ${gruppe.length - geprueftAnzahl > 0 ? `<span class="popup-badge badge-nein">${gruppe.length - geprueftAnzahl}× nein</span>` : ''}
      </span>
    </div>
    <div class="popup-row">
      <span class="popup-label">Bearbeiter</span>
      <span class="popup-value">${[...new Set(gruppe.map(d => d.bearbeiter))].join(', ')}</span>
    </div>
  </div>`;
}

function uiAufbauen(lagerListe, lagerCounts) {
  const legendFrag = document.createDocumentFragment();
  const filterFrag = document.createDocumentFragment();

  lagerListe.forEach(lager => {
    const farbe = lagerFarbe(lager);
    const count = lagerCounts[lager] || 0;

    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${farbe}"></div>
      <span>${lager}</span><span class="legend-count">${count}</span>`;
    legendFrag.appendChild(item);

    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.style.borderLeft = `3px solid ${farbe}`;
    btn.innerHTML = `${lager}<span class="filter-count">${count}</span>`;
    btn.onclick = function() { lagerFiltern(lager, this); };
    filterFrag.appendChild(btn);
  });

  document.getElementById('legend-items').appendChild(legendFrag);
  document.getElementById('filter-buttons').appendChild(filterFrag);
}

function lagerFiltern(name, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ebene.clearLayers();
  alleMarker.forEach(({ marker, lager }) => {
    if (name === 'all' || lager === name) ebene.addLayer(marker);
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// ANIMATED COUNTER
// ═══════════════════════════════════════════════════════════════════════════════
function countUp(el, target, duration) {
  const start = performance.now();
  function step(now) {
    const p    = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3); // ease-out cubic
    el.textContent = Math.round(ease * target);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ═══════════════════════════════════════════════════════════════════════════════
// CSV DOWNLOAD
// Exports all records for the currently displayed date as a UTF-8 CSV with BOM
// (BOM ensures Excel opens it with correct encoding).
// ═══════════════════════════════════════════════════════════════════════════════
function csvHerunterladen() {
  if (!AKTUELLES_DATUM) return;
  const daten = ALLE_LIEFERSCHEINE.filter(d => d.datum === AKTUELLES_DATUM);
  if (daten.length === 0) { alert('Keine Daten für dieses Datum vorhanden.'); return; }

  const q = v => `"${(v || '').replace(/"/g, '""')}"`;  // quote + escape

  const header = 'Lagerkürzel;Auftragsnummer;LS-Nr.;geprüft j/n;Lieferdatum;Bearbeiter;Kundennummer;Kundenname;Straße;PLZ;Ort';
  const zeilen = daten.map(d =>
    [d.lager, d.auftrags, d.ls, d.geprueft, d.datum, d.bearbeiter, d.kundennr, d.kunde, d.strasse, d.plz, d.ort]
    .map(q).join(';')
  );

  const csvText = '\uFEFF' + [header, ...zeilen].join('\r\n');
  const blob    = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
  const url     = URL.createObjectURL(blob);
  const a       = Object.assign(document.createElement('a'), {
    href: url,
    download: `Lieferscheine_${AKTUELLES_DATUM.replace(/\./g, '-')}.csv`,
  });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
csvLaden();
