      box-shadow: var(--shadow-medium);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(45deg, rgba(255,255,255,0.08) 0%, transparent 50%, rgba(255,255,255,0.04) 100%);

      gap: 16px;

      position: relative;

    .logo-circle {

      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 3px solid rgba(255,255,255,0.25);
      box-shadow: var(--shadow-medium);
      position: relative;
    }

    .logo-letter {

      line-height: 1; margin-top: -4px;

      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%);

    .logo-text {
      font-size: 26px; font-weight: 600;
      text-transform: lowercase; letter-spacing: 1px;
    }

    .header h1 {

      letter-spacing: -0.3px;
      position: relative; z-index: 1;
    }

    .header p {

      margin-top: 4px;
      position: relative; z-index: 1;
    }

    /* Stats bar */

      padding: 20px 24px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-light);
      border: 1px solid rgba(0,0,0,0.05);
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
    }

    .stats-bar::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-color));

    .stat {
      text-align: center;
      padding: 12px 20px;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.04);
      min-width: 90px;
      transition: var(--transition);
    }

    .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-light); }

    .stat-number {
      font-size: 1.8em; font-weight: 700;
      color: var(--primary-color); line-height: 1;
    }

    .stat-label {
      font-size: 11px; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-top: 4px;

    .stats-title {
      font-weight: 600; font-size: 14px;
      color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-right: auto;

      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow-medium);
      position: relative;
    }

      width: 100%;
      height: calc(100vh - 260px);
      min-height: 500px;

      bottom: 20px; left: 20px;
      background: rgba(255,255,255,0.96);
      padding: 16px 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-light);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
      min-width: 160px;

      font-size: 12px; font-weight: 700;

      margin-bottom: 12px;
      padding-bottom: 8px;

      background: rgba(255,255,255,0.96);
      padding: 16px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-light);
      backdrop-filter: blur(10px);

      z-index: 1000;

</head>

// ── Colour palette per Lager ─────────────────────────────────────────────────
const LAGER_COLORS = {
  "Planegg":               "#1c5975",
  "AMW Auersperg":         "#667eea",
  "aboutwater Bünde":      "#28a745",
  "aboutwater Frankfurt":  "#fd7e14",
  "VST Plep":              "#764ba2",
  "VST Schörling":         "#e83e8c",
  "Kyffhäuser":            "#20c997",
  "Emons":                 "#dc3545",
  "STK Service":           "#6f42c1",
  "CJM":                   "#17a2b8",
  "AQUATRADE Bram":        "#ffc107",
  "Gänshirt-Aufmbruch":   "#6c757d",
};

function getLagerColor(lager) {
  return LAGER_COLORS[lager] || "#95a5a6";
}

// ── Geocoding via Nominatim ───────────────────────────────────────────────────
const geoCache = {};

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function geocode(plz, ort, land) {
  const key = `${plz}|${land}`;
  if (geoCache[key]) return geoCache[key];

  const q = `${plz} ${ort}, ${land}`;
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=${land.toLowerCase()}`;

  try {
    const r = await fetch(url, { headers: { 'User-Agent': 'aboutwater_lieferschein_map/1.0' } });
    const data = await r.json();
    if (data.length > 0) {
      const coord = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      geoCache[key] = coord;
      return coord;
    }
  } catch(e) { console.warn('Geocode failed:', q, e); }
  return null;
}

// ── Map initialisation ───────────────────────────────────────────────────────
const map = L.map('map', {
  center: [51.2, 10.4],
  zoom: 6,
  zoomControl: true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 18,
}).addTo(map);

// Marker layer groups
const allMarkers = [];
const lagerGroups = {};
let allLayers = L.layerGroup().addTo(map);

function makeMarkerIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24c0-6.6-5.4-12-12-12z"
          fill="${color}" stroke="white" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="4" fill="white" opacity="0.9"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [24, 36],
    iconAnchor: [12, 36],
    popupAnchor: [0, -38],
  });
}

function buildPopup(group) {
  const first = group[0];
  const color = getLagerColor(first.lager);
  const geprueftCount = group.filter(d => d.geprueft === 'ja').length;

  let lsRows = group.map(d =>
    `<div class="popup-row">
      <span class="popup-label">LS-Nr.</span>
      <span class="popup-value">${d.ls}</span>
    </div>`
  ).join('');

  return `<div class="popup-content">
    <div class="popup-header" style="border-color:${color}">${first.kunde}</div>
    <div class="popup-row">
      <span class="popup-label">Adresse</span>
      <span class="popup-value">${first.strasse}, ${first.plz} ${first.ort}</span>
    </div>
    <div class="popup-row">
      <span class="popup-label">Lager</span>
      <span class="popup-value" style="color:${color};font-weight:600">${first.lager}</span>
    </div>
    <div class="popup-row">
      <span class="popup-label">Lieferscheine</span>
      <span class="popup-value"><span class="popup-count">${group.length}</span></span>
    </div>
    ${lsRows}
    <div class="popup-row">
      <span class="popup-label">Geprüft</span>
      <span class="popup-value">${geprueftCount}/${group.length} <span class="popup-badge badge-ja">ja</span></span>
    </div>
    <div class="popup-row">
      <span class="popup-label">Bearbeiter</span>
      <span class="popup-value">${[...new Set(group.map(d=>d.bearbeiter))].join(', ')}</span>
    </div>
  </div>`;
}

// ── Filter logic ─────────────────────────────────────────────────────────────
function filterLager(name, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  allLayers.clearLayers();

  allMarkers.forEach(({ marker, lager }) => {
    if (name === 'all' || lager === name) {
      allLayers.addLayer(marker);
    }
  });
}

// ── Build legend & filter buttons ────────────────────────────────────────────
function buildUI(lagers) {
  const legendEl = document.getElementById('legend-items');
  const filterEl = document.getElementById('filter-buttons');

  lagers.forEach(lager => {
    const color = getLagerColor(lager);
    legendEl.innerHTML += `
      <div class="legend-item">
        <div class="legend-dot" style="background:${color}"></div>
        <span>${lager}</span>
      </div>`;

    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = lager;
    btn.style.borderLeft = `3px solid ${color}`;
    btn.onclick = function() { filterLager(lager, this); };
    filterEl.appendChild(btn);
  });
}

// ── Main: geocode & place markers ────────────────────────────────────────────
async function init() {
  // Group deliveries by unique PLZ+kunde combo (same address = same marker)
  const groups = {};
  DELIVERIES.forEach(d => {
    const key = `${d.plz}|${d.ort}|${d.kunde}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  });

  const groupKeys = Object.keys(groups);
  const uniquePlzSet = {};
  groupKeys.forEach(k => {
    const d = groups[k][0];
    uniquePlzSet[`${d.plz}|${d.land}`] = d;
  });
  const uniqueLocations = Object.values(uniquePlzSet);

  let done = 0;
  const total = uniqueLocations.length;

  // Pre-geocode unique postal codes
  for (const d of uniqueLocations) {
    document.getElementById('loading-text').textContent = `Geocodierung: ${d.plz} ${d.ort}`;
    document.getElementById('loading-sub').textContent = `${done + 1} von ${total} Standorten`;
    document.getElementById('progress-fill').style.width = `${Math.round((done / total) * 100)}%`;
    await geocode(d.plz, d.ort, d.land);
    done++;
    await delay(1100); // Nominatim rate limit: 1 req/sec
  }

  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('loading-text').textContent = 'Karte wird erstellt…';

  // Place markers
  const lagerSet = new Set();
  let placedCount = 0;

  for (const key of groupKeys) {
    const group = groups[key];
    const first = group[0];
    const coord = geoCache[`${first.plz}|${first.land}`];
    if (!coord) continue;

    lagerSet.add(first.lager);

    // Small random jitter for same-location markers
    const jitLat = coord.lat + (Math.random() - 0.5) * 0.003;
    const jitLng = coord.lng + (Math.random() - 0.5) * 0.003;

    const color = getLagerColor(first.lager);
    const marker = L.marker([jitLat, jitLng], { icon: makeMarkerIcon(color) })
      .bindPopup(buildPopup(group), { maxWidth: 300 });

    allMarkers.push({ marker, lager: first.lager });
    allLayers.addLayer(marker);
    placedCount++;
  }

  // Stats
  document.getElementById('stat-total').textContent = DELIVERIES.length;
  document.getElementById('stat-locations').textContent = placedCount;
  document.getElementById('stat-lager').textContent = lagerSet.size;
  document.getElementById('stat-geprueft').textContent =
    DELIVERIES.filter(d => d.geprueft === 'ja').length;

  buildUI([...lagerSet].sort());

  // Hide loading
  document.getElementById('loading').style.display = 'none';
}

init();
</script>
